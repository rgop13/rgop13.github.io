- title: "KURE: Korea University Retrieval Embedding Model 개발"
  period: "2024.08 ~ 2026.09"
  role: "KURE 개발 팀 리더"
  purpose: "한국어 중심에서 한·영 이중언어로 확장한 오픈소스 검색 모델 시리즈와 재현 가능한 평가 기반 개발"
  overview: |
    질의, 문서, hard negative로 구성된 약 200만 건의 한국어 학습 데이터로 BGE-M3를 미세조정한 KURE-v1과 학습 및 평가 코드를 공개했습니다. 후속 KURE-v2에서는 2,070만 건의 비지도 학습 쌍, 한·영 이중언어 late-interaction 검색 구조, 지식 증류를 결합했습니다. 1억 5,400만 파라미터로 MTEB(kor, v2) 한국어 검색 9개 과제 평균 nDCG@10 0.8160을 기록해 2026년 9월 공개 평가 기준 1위에 올랐습니다. KURE를 대표 모델로 포함한 ‘한국어 특화 생성·검색 AI 모델 개발’ 성과는 과학기술정보통신부 2025 국가연구개발 우수성과 100선 정보·전자 분야에 선정되었습니다.
  learnings: []
  stack: ["Information Retrieval", "BGE-M3", "Late Interaction", "Multi-vector Retrieval", "Contrastive Learning", "Knowledge Distillation", "MTEB"]
  links:
    - { label: "GitHub", url: "https://github.com/nlpai-lab/KURE" }
    - { label: "KURE-v1 모델", url: "https://huggingface.co/nlpai-lab/KURE-v1" }
    - { label: "KURE-v2 모델", url: "https://huggingface.co/nlpai-lab/KURE-v2" }
    - { label: "KURE-v2 공식 기사", url: "https://www.korea.ac.kr/bbs/ko/42/122156/artclView.do" }
    - { label: "국가연구개발 우수성과 100선", url: "https://www.korea.ac.kr/bbs/ko/42/121308/artclView.do" }
    - { label: "KURE-v1 논문", url: "https://www.koreascience.kr/article/CFKO202533761230731.view?hide=breadcrumb%2Cjournalinfo&orgId=anpor" }

- title: "벡터 임베딩 구축과 유사도 검색 원천기술 개발"
  period: "2024.01.01 ~ 2024.12.31"
  role: "텍스트 임베딩 및 의미 검색 연구개발"
  purpose: "텍스트를 의미 기반 벡터로 표현하고 질의와 문서 간 유사도를 활용하는 검색 원천기술 개발"
  overview: |
    텍스트 임베딩 구축과 벡터 유사도 기반 검색 기술을 개발했습니다. 연구 성과는 두 기업에 각각 1억 원 규모로 기술이전되었고, 이 가운데 한 건은 프롬프트 활용 노하우를 포함했습니다.
  learnings: []
  stack: ["NLP", "Text Embedding", "Semantic Search", "Vector Retrieval", "Information Retrieval"]
  links:
    - { label: "기술이전 실적", url: "https://bk21cs.korea.ac.kr/bk21cs/board/data.do?articleNo=781378&attachNo=289837&mode=download&totalBoardNo=&totalNoticeYn=" }

- title: "영화 추천시스템 개발을 위한 메타데이터 증강 및 구조화 기술 개발"
  period: "2023.02 ~ 2023.05"
  role: "메타데이터 증강 및 구조화 연구개발"
  purpose: "비정형 영화 정보를 추천시스템에서 활용할 수 있는 메타데이터로 확장하고 구조화"
  overview: |
    영화 콘텐츠의 비정형 정보를 추천에 활용할 수 있는 메타데이터로 확장하고 일관된 구조로 정리하는 기술을 연구했습니다. 콘텐츠의 다양한 속성과 영화 간 연관성을 추천 모델이 활용할 수 있는 데이터 기반으로 만드는 데 초점을 맞췄습니다.
  learnings: []
  stack: ["Content Metadata", "Metadata Engineering", "Data Structuring", "Recommender Systems"]
  links: []

- title: "삼성 모바일 제품 디자인 분석 기술 개발"
  period: "2022.08 ~ 2022.12"
  role: "NLP 모델 및 검색 파이프라인 연구개발"
  purpose: "모바일 제품 관련 대규모 텍스트에서 디자인 속성, 관련 문장, 잠재 주제를 찾아 제품 디자인 의사결정을 지원"
  overview: |
    YouTube 자막과 댓글을 분석하는 연구를 삼성 제품 및 디자인 관련성 분류, seed attribute 기반 의미 검색, 비지도 토픽 탐색의 세 단계로 설계했습니다. 언어 모델 기반 관련성 이진 분류, 코사인 유사도 기반 Top-K 검색, LDA와 BERTopic 비교를 하나의 디자인 분석 흐름으로 구성했습니다.
  learnings: []
  stack: ["BERT", "RoBERTa", "Sentence-BERT", "BERTopic", "Semantic Search", "Topic Modeling", "Text Classification"]
  links: []

- title: "전문지식 대상 판단결과의 이유/근거를 설명가능한 전문가 의사 결정 지원 인공지능 기술개발"
  period: "2022.04.01 ~ 2026.12.31"
  role: "고려대학교 기관실무담당자"
  purpose: "상황에 맞는 전문지식과 사례를 검색 및 추론하고 판단 결과의 이유와 근거를 자연어로 설명하는 의사결정 지원 AI 개발"
  overview: |
    과제번호 2022-0-00369의 고려대학교 기관실무담당자로서 참여기관의 과제 운영 실무를 담당했습니다. 과제는 변화하는 전문지식의 지속학습, 사례 및 출처 기반 추론, 다중 문서 요약, 판단 예측과 근거 보고서 생성을 핵심 연구 범위로 합니다.
  learnings: []
  stack: ["Explainable AI", "Decision Support", "Evidence Reasoning", "Continual Learning", "Multi-document Summarization", "Report Generation"]
  links:
    - { label: "과제 소개", url: "https://etri-visualintelligence.github.io/xainlp/" }
    - { label: "연차보고서", url: "https://ksp.etri.re.kr/ksp/report/read?id=37547" }

- title: "실감형 문화유산 체험을 위한 애셋 기반 지능형 큐레이션 및 서비스 운영기술 개발: 지식 기반 관계 네트워크 생성을 위한 텍스트 마이닝 연구"
  period: "2022.01 ~ 2022.12"
  role: "고려대학교 참여연구원 · KoCHET 공동 제1저자"
  purpose: "문화유산 텍스트에서 개체와 관계를 추출해 지식 관계 네트워크를 구축하고 지능형 검색과 큐레이션에 활용"
  overview: |
    문화유산 도메인에 특화된 개체명 인식과 관계 추출을 연구하고, 추출 결과를 개체, 관계, 개체 트리플로 구조화해 지식 그래프 생성과 시각화의 기반을 마련했습니다. 직접 성과인 KoCHET에는 개체명 인식 112,362건, 관계 추출 38,765건, 개체 유형 분류 113,198건의 예제가 포함되며, COLING 2022에 공동 제1저자로 발표했습니다.
  learnings: []
  stack: ["Korean NLP", "Named Entity Recognition", "Relation Extraction", "Entity Typing", "Knowledge Graph", "Domain Corpus"]
  links:
    - { label: "KoCHET 논문", url: "https://aclanthology.org/2022.coling-1.308/" }
    - { label: "KoCHET 데이터", url: "https://github.com/Gyeongmin47/KoCHET-A-Korean-Cultural-Heritage-corpus-for-Entity-related-Tasks" }

- title: "특허 문서의 발명 목적 문장 추출 및 Key phrase 추출 기술 개발"
  period: "2021.06.01 ~ 2021.10.31"
  role: "특허 NLP 모델 연구개발 · 논문 공동 제1저자"
  purpose: "비정형 특허 문서에서 발명의 목적 문장과 핵심 명사구를 자동 추출하는 도메인 특화 NLP 파이프라인 개발"
  overview: |
    약 1.93GB, 155만여 문장의 특허 말뭉치를 구축하고 T5-large 추가 사전학습, TextRank 기반 요약, 목적 문장 분류 및 핵심 명사구 추출과 생성 파이프라인을 개발했습니다. 최종보고서에서 목적 문장 추출 점수 93과 Key phrase Exact@10 36.95로 목표치 90과 35를 각각 넘겼으며, 연구 결과를 IEEE Access 논문에 공동 제1저자로 발표했습니다.
  learnings: []
  stack: ["T5", "SciBERT", "TextRank", "Domain-adaptive Pre-training", "Sentence Extraction", "Keyphrase Generation"]
  links:
    - { label: "IEEE Access 논문", url: "https://ieeexplore.ieee.org/document/9779775" }
